<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ギター指板 音名クイズ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app" data-state="idle">
      <header class="header">
        <h1 class="title">ギター指板 音名クイズ</h1>
        <div class="stats">
          <span class="stat" id="progress">0 / 7 問</span>
          <span class="stat" id="miss">ミス 0</span>
        </div>
      </header>

      <main class="main">
        <section class="prompt" aria-live="polite">
          <p class="prompt-question">
            <strong class="prompt-note" id="question-note"></strong>
            <span class="prompt-lead" id="prompt-lead"></span>
          </p>
          <p class="prompt-remaining" id="remaining"></p>
        </section>

        <section class="settings" id="settings">
          <h2 class="settings-title">出題設定</h2>

          <div class="setting-row">
            <span class="setting-label">音の種類</span>
            <div class="setting-options">
              <label class="option"><input type="checkbox" checked disabled /> ナチュラル</label>
              <label class="option"><input type="checkbox" id="opt-sharps" /> ♯ を含める</label>
              <label class="option"><input type="checkbox" id="opt-flats" /> ♭ を含める</label>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-label">対象の弦</span>
            <div class="setting-options" id="opt-strings">
              <label class="option"><input type="checkbox" value="1" checked /> 1弦</label>
              <label class="option"><input type="checkbox" value="2" checked /> 2弦</label>
              <label class="option"><input type="checkbox" value="3" checked /> 3弦</label>
              <label class="option"><input type="checkbox" value="4" checked /> 4弦</label>
              <label class="option"><input type="checkbox" value="5" checked /> 5弦</label>
              <label class="option"><input type="checkbox" value="6" checked /> 6弦</label>
            </div>
          </div>

          <p class="settings-summary" id="settings-summary"></p>
        </section>

        <section class="result" aria-live="polite">
          <h2 class="result-title">セッション終了</h2>
          <dl class="result-grid">
            <div class="result-item">
              <dt>出題数</dt>
              <dd id="result-questions">-</dd>
            </div>
            <div class="result-item">
              <dt>正解タップ</dt>
              <dd id="result-correct">-</dd>
            </div>
            <div class="result-item">
              <dt>誤答タップ</dt>
              <dd id="result-wrong">-</dd>
            </div>
            <div class="result-item is-primary">
              <dt>正答率</dt>
              <dd id="result-accuracy">-</dd>
            </div>
          </dl>
        </section>

        <section class="board-area">
          <div class="fretboard" id="fretboard"></div>
        </section>
      </main>

      <footer class="footer">
        <button class="secondary-button" id="secondary-button" type="button">設定を変える</button>
        <button class="primary-button" id="primary-button" type="button">スタート</button>
      </footer>

      <footer class="site-footer">
        <p class="credit">
          © 2026 moyashidaisuke<span class="credit-sep">·</span
          ><a
            class="credit-link"
            href="https://x.com/moyashidaisuke"
            target="_blank"
            rel="noopener noreferrer"
            >@moyashidaisuke</a
          >
        </p>
      </footer>
    </div>

    <p class="sr-only" id="sr-status" role="status" aria-live="polite"></p>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
